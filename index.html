<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blurry Matcha | طلبات ماتشا</title>
    <!-- خط عربي أنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* إخفاء شعار نتليفاي بشكل جذري من الصفحة للزوار */
        body > div[style*="z-index"], 
        #netlify-badge, 
        iframe[src*="netlify"], 
        a[href*="netlify.com/support"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f4f7f4;
            color: #2c3e2d;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(44, 62, 45, 0.08);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px dashed #d8e2d8;
            padding-bottom: 15px;
        }

        header h1 {
            font-size: 26px;
            color: #3b533c;
            font-weight: 900;
            margin-bottom: 5px;
        }

        header p {
            color: #7f9a80;
            font-size: 14px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 20px 0 10px;
            color: #3b533c;
            border-right: 4px solid #5a7d5b;
            padding-right: 8px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background: #fafcf9;
            border: 1px solid #e1eade;
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .item-card:hover {
            border-color: #5a7d5b;
        }

        .item-info h3 {
            font-size: 15px;
            font-weight: 700;
            color: #2c3e2d;
        }

        .item-info span {
            font-size: 13px;
            color: #5a7d5b;
            font-weight: 500;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: #5a7d5b;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .qty-btn:active {
            background: #3b533c;
        }

        .qty-input {
            width: 35px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 3px;
            background: #fff;
        }

        .options-group {
            margin-top: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #3b533c;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d8e2d8;
            border-radius: 10px;
            font-size: 14px;
            background: #fafcf9;
            color: #2c3e2d;
            outline: none;
            margin-bottom: 15px;
        }

        select:focus, input[type="text"]:focus {
            border-color: #5a7d5b;
            background: #fff;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: normal;
            cursor: pointer;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: #5a7d5b;
            cursor: pointer;
        }

        .summary-box {
            background: #eef3ee;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }

        .summary-box h3 {
            font-size: 16px;
            color: #3b533c;
            margin-bottom: 5px;
        }

        .total-price {
            font-size: 20px;
            font-weight: 900;
            color: #5a7d5b;
        }

        .checkout-btn {
            width: 100%;
            background: #3b533c;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(59, 83, 60, 0.2);
        }

        .checkout-btn:hover {
            background: #2c3e2d;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #8fa890;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Blurry Matcha</h1>
            <p>اختر طلبك، ونسق معنا بكل سهولة 🌿</p>
        </header>

        <!-- قائمة المنتجات -->
        <div class="section-title">قائمة الماتشا والمخبوزات</div>
        <div class="menu-grid" id="menu-items">
            <!-- سيتم توليد العناصر برمجياً أو وضعها مباشرة -->
            <div class="item-card" data-name="Vanilla Foam" data-price="20">
                <div class="item-info">
                    <h3>Vanilla Foam</h3>
                    <span>20 SAR</span>
                </div>
                <div class="quantity-control">
                    <button type="button" class="qty-btn" onclick="changeQty(this, -1)">-</button>
                    <input type="text" class="qty-input" value="0" readonly>
                    <button type="button" class="qty-btn" onclick="changeQty(this, 1)">+</button>
                </div>
            </div>

            <div class="item-card" data-name="Classic Matcha" data-price="19">
                <div class="item-info">
                    <h3>Classic Matcha</h3>
                    <span>19 SAR</span>
                </div>
                <div class="quantity-control">
                    <button type="button" class="qty-btn" onclick="changeQty(this, -1)">-</button>
                    <input type="text" class="qty-input" value="0" readonly>
                    <button type="button" class="qty-btn" onclick="changeQty(this, 1)">+</button>
                </div>
            </div>

            <div class="item-card" data-name="Banana Bread" data-price="22">
                <div class="item-info">
                    <h3>Banana Bread</h3>
                    <span>22 SAR</span>
                </div>
                <div class="quantity-control">
                    <button type="button" class="qty-btn" onclick="changeQty(this, -1)">-</button>
                    <input type="text" class="qty-input" value="0" readonly>
                    <button type="button" class="qty-btn" onclick="changeQty(this, 1)">+</button>
                </div>
            </div>

            <div class="item-card" data-name="Mixed Berry" data-price="23">
                <div class="item-info">
                    <h3>Mixed Berry</h3>
                    <span>23 SAR</span>
                </div>
                <div class="quantity-control">
                    <button type="button" class="qty-btn" onclick="changeQty(this, -1)">-</button>
                    <input type="text" class="qty-input" value="0" readonly>
                    <button type="button" class="qty-btn" onclick="changeQty(this, 1)">+</button>
                </div>
            </div>

            <div class="item-card" data-name="Strawberry" data-price="22">
                <div class="item-info">
                    <h3>Strawberry</h3>
                    <span>22 SAR</span>
                </div>
                <div class="quantity-control">
                    <button type="button" class="qty-btn" onclick="changeQty(this, -1)">-</button>
                    <input type="text" class="qty-input" value="0" readonly>
                    <button type="button" class="qty-btn" onclick="changeQty(this, 1)">+</button>
                </div>
            </div>

            <div class="item-card" data-name="Special Matcha" data-price="24">
                <div class="item-info">
                    <h3>Special Matcha</h3>
                    <span>24 SAR</span>
                </div>
                <div class="quantity-control">
                    <button type="button" class="qty-btn" onclick="changeQty(this, -1)">-</button>
                    <input type="text" class="qty-input" value="0" readonly>
                    <button type="button" class="qty-btn" onclick="changeQty(this, 1)">+</button>
                </div>
            </div>
        </div>

        <!-- خيارات الحليب -->
        <div class="options-group">
            <div class="section-title">نوع الحليب</div>
            <select id="milk-option">
                <option value="حليب عادي (Regular)">عادي (Regular)</option>
                <option value="خالي من اللاكتوز (Lactose-Free)">خالي من اللاكتوز (Lactose-Free)</option>
                <option value="حليب الشوفان (Oat)">شوفان (Oat)</option>
                <option value="حليب الفانيلا (Vanilla)">فانيلا (Vanilla)</option>
                <option value="حليب جوز الهند (Coconut)">جوز الهند (Coconut)</option>
            </select>
        </div>

        <!-- الإضافات -->
        <div class="options-group">
            <div class="section-title">الإضافات</div>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="extras" value="Double Matcha"> دبل ماتشا (Double Matcha)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="extras" value="Extra Syrup"> سيرب إضافي (Extra Syrup)
                </label>
            </div>
        </div>

        <!-- طريقة الدفع -->
        <div class="options-group">
            <div class="section-title">طريقة الدفع</div>
            <select id="payment-option">
                <option value="تحويل بنكي (Bank Transfer)">تحويل بنكي</option>
                <option value="الدفع عند الاستلام (Cash on Delivery)">الدفع عند الاستلام</option>
            </select>
        </div>

        <!-- ملاحظات العميل -->
        <div class="options-group">
            <label for="customer-notes">ملاحظات إضافية (اختياري)</label>
            <input type="text" id="customer-notes" placeholder="أي ملاحظات خاصة بالطلب؟">
        </div>

        <!-- المجموع وزر الطلب -->
        <div class="summary-box">
            <h3>المجموع الكلي</h3>
            <div class="total-price"><span id="total-amount">0</span> SAR</div>
        </div>

        <button type="button" class="checkout-btn" onclick="sendOrder()">إتمام الطلب عبر Instagram</button>

        <footer>
            <p>Blurry Matcha © 2026</p>
        </footer>
    </div>

    <script>
        function changeQty(button, delta) {
            const card = button.closest('.item-card');
            const input = card.querySelector('.qty-input');
            let currentVal = parseInt(input.value) || 0;
            currentVal += delta;
            if (currentVal < 0) currentVal = 0;
            input.value = currentVal;
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            const cards = document.querySelectorAll('.item-card');
            cards.forEach(card => {
                const price = parseFloat(card.getAttribute('data-price'));
                const qty = parseInt(card.querySelector('.qty-input').value) || 0;
                total += price * qty;
            });
            document.getElementById('total-amount').innerText = total;
        }

        function sendOrder() {
            let orderSummary = "مرحباً، أود طلب التالي من Blurry Matcha:\n\n";
            let hasItems = false;
            
            const cards = document.querySelectorAll('.item-card');
            cards.forEach(card => {
                const qty = parseInt(card.querySelector('.qty-input').value) || 0;
                if (qty > 0) {
                    hasItems = true;
                    const name = card.getAttribute('data-name');
                    const price = card.getAttribute('data-price');
                    orderSummary += `- ${name} × ${qty} (${price * qty} SAR)\n`;
                }
            });

            if (!hasItems) {
                alert("الرجاء اختيار منتج واحد على الأقل قبل إتمام الطلب.");
                return;
            }

            const milk = document.getElementById('milk-option').value;
            orderSummary += `\nنوع الحليب: ${milk}\n`;

            const selectedExtras = [];
            document.querySelectorAll('input[name="extras"]:checked').forEach(el => {
                selectedExtras.push(el.value);
            });
            if (selectedExtras.length > 0) {
                orderSummary += `الإضافات: ${selectedExtras.join(', ')}\n`;
            }

            const payment = document.getElementById('payment-option').value;
            orderSummary += `طريقة الدفع: ${payment}\n`;

            const notes = document.getElementById('customer-notes').value.trim();
            if (notes) {
                orderSummary += `ملاحظات: ${notes}\n`;
            }

            const total = document.getElementById('total-amount').innerText;
            orderSummary += `\nالمجموع الكلي: ${total} SAR`;

            // نسخ النص للحافظة
            navigator.clipboard.writeText(orderSummary).then(() => {
                alert("تم نسخ تفاصيل الطلب بنجاح! سيتم توجيهك الآن إلى الانستغرام.");
                window.location.href = "https://www.instagram.com/blurrys.sa";
            }).catch(err => {
                // في حال فشل النسخ لأسباب أمنية في المتصفح
                window.location.href = "https://www.instagram.com/blurrys.sa";
            });
        }
    </script>
</body>
</html>
